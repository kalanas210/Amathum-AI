<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<title>Sign in · Naxter PBX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){
    const t = localStorage.getItem('theme');
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches))
      document.documentElement.classList.add('dark');
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root { --bg:0 0% 100%; --fg:224 71% 4%; --card:0 0% 100%; --border:220 13% 91%; --muted:220 14% 96%; --muted-fg:220 9% 46%; --primary:224 71% 4%; --primary-fg:210 20% 98%; }
  .dark { --bg:224 12% 6%; --fg:220 13% 95%; --card:224 13% 8%; --border:220 13% 16%; --muted:224 13% 12%; --muted-fg:220 9% 62%; --primary:220 13% 95%; --primary-fg:224 71% 8%; }
  body { font-family:'Inter',sans-serif; background: hsl(var(--bg)); color: hsl(var(--fg)); }
  input { background: hsl(var(--card)); color: hsl(var(--fg)); border-color: hsl(var(--border)); }
  input:focus { outline: 2px solid hsl(var(--primary) / 0.35); outline-offset: 1px; border-color: hsl(var(--primary)); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-sm">
  <div class="flex justify-center mb-6">
    <div class="w-12 h-12 rounded-xl flex items-center justify-center" style="background:hsl(var(--primary));color:hsl(var(--primary-fg))">
      <i data-lucide="phone-call" class="w-6 h-6"></i>
    </div>
  </div>

  <div class="rounded-xl border p-6 shadow-sm" style="background:hsl(var(--card));border-color:hsl(var(--border))">
    <h1 class="text-xl font-semibold">Sign in</h1>
    <p class="text-sm mt-1" style="color:hsl(var(--muted-fg))">Naxter PBX admin panel</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
    <div class="mt-4 px-3 py-2 rounded-md text-sm bg-rose-50 text-rose-700 border border-rose-200 dark:bg-rose-950/50 dark:text-rose-300 dark:border-rose-900">{{ msg }}</div>
    {% endfor %}
    {% endwith %}

    <form method="post" class="mt-5 space-y-3.5">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div>
        <label class="block text-xs font-medium mb-1.5" style="color:hsl(var(--fg))">Email</label>
        <input name="email" type="email" required autocomplete="username"
               class="w-full px-3 py-2 text-sm border rounded-md focus:outline-none"
               placeholder="you@company.com">
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5" style="color:hsl(var(--fg))">Password</label>
        <input name="password" type="password" required autocomplete="current-password"
               class="w-full px-3 py-2 text-sm border rounded-md focus:outline-none"
               placeholder="••••••••">
      </div>
      <button type="submit" class="w-full text-sm font-medium py-2 rounded-md transition-opacity hover:opacity-90"
              style="background:hsl(var(--primary));color:hsl(var(--primary-fg))">Sign in</button>
    </form>
  </div>

  <p class="text-center text-xs mt-5" style="color:hsl(var(--muted-fg))">Behind Cloudflare Access for zero-trust auth</p>
</div>
<script>lucide.createIcons()</script>
</body>
</html>
