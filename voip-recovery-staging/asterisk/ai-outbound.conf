; ============================================================
;  [ai-outbound] — AI OUTBOUND confirmation calls (Phase 2)
;  Appended by install-outbound.sh. The app (pbx-monitor) originates a call to
;  the buyer with channel var AI_UUID set and Context=ai-outbound; on answer this
;  context bridges the call to the Node agent on port 9092, which reads
;  /var/lib/sampath-ai/outbound/<uuid>.json and confirms the order.
;  ADDITIVE — does NOT touch the inbound [ai-agent] / [ai-agent-retry] contexts.
; ============================================================
[ai-outbound]
exten => s,1,NoOp(AI OUTBOUND confirm call uuid=${AI_UUID})
 same => n,Set(__AI_UUID=${FILTER(0-9a-f-,${AI_UUID})})
 same => n,Answer()
 same => n,System(mkdir -p /var/lib/sampath-ai/channels && echo '${CHANNEL}' > /var/lib/sampath-ai/channels/${AI_UUID}.chan && chown asterisk:asterisk /var/lib/sampath-ai/channels/${AI_UUID}.chan)
 same => n,AudioSocket(${AI_UUID},127.0.0.1:9092)
 same => n,Hangup()

exten => h,1,NoOp(AI outbound call ended uuid=${AI_UUID})
 same => n,System(rm -f /var/lib/sampath-ai/channels/${AI_UUID}.chan)
